name: Deploy to Ubuntu Server

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Install dependencies
      run: go mod download
      
    - name: Run tests
      run: go test -v ./...
      
    - name: Build application
      run: go build -o go-book-api .
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: go-book-api-binary
        path: go-book-api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: go-book-api-binary
        path: ./
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Create application user if it doesn't exist
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S useradd -r -s /bin/false go-book-api || echo "User go-book-api already exists"
          
          # Create application directory if it doesn't exist
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S mkdir -p /opt/go-book-api
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S chown go-book-api:go-book-api /opt/go-book-api
          
          # Stop the service if it's running
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S systemctl stop go-book-api || true
          
          # Backup current binary
          if [ -f /opt/go-book-api/go-book-api ]; then
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S cp /opt/go-book-api/go-book-api /opt/go-book-api/go-book-api.backup.$(date +%Y%m%d_%H%M%S)
          fi
          
          # Create logs directory
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S mkdir -p /var/log/go-book-api
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S chown go-book-api:go-book-api /var/log/go-book-api
          
    - name: Copy binary to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        source: "go-book-api"
        target: "/opt/go-book-api/"
        overwrite: true
        
    - name: Copy systemd service file
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        source: "deploy/go-book-api.service"
        target: "/tmp/"
        overwrite: true
        debug: true
        
    - name: Copy environment file
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        source: "deploy/env.production"
        target: "/opt/go-book-api/.env"
        overwrite: true
        debug: true
        
    - name: Setup and start service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Debug: List files in /tmp to verify they were copied
          echo "Files in /tmp:"
          ls -la /tmp/
          
          # Make binary executable and set correct ownership
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S chmod +x /opt/go-book-api/go-book-api
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S chown go-book-api:go-book-api /opt/go-book-api/go-book-api
          
          # Find and copy the service file
          SERVICE_FILE=""
          if [ -f /tmp/go-book-api.service ]; then
            SERVICE_FILE="/tmp/go-book-api.service"
          elif [ -f /tmp/deploy/go-book-api.service ]; then
            SERVICE_FILE="/tmp/deploy/go-book-api.service"
          else
            echo "ERROR: Service file not found in expected locations"
            echo "Searching for service files:"
            find /tmp -name "*.service" -type f 2>/dev/null || echo "No .service files found"
            exit 1
          fi
          
          echo "Found service file at: $SERVICE_FILE"
          echo "Service file contents:"
          cat "$SERVICE_FILE"
          
          # Copy service file to systemd directory
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S cp "$SERVICE_FILE" /etc/systemd/system/go-book-api.service
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S systemctl daemon-reload
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S systemctl enable go-book-api
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S systemctl start go-book-api
          
          # Wait a moment for service to start
          sleep 5
          
          # Check service status
          echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S systemctl status go-book-api --no-pager
          
          # Test health endpoint
          curl -f http://localhost:8080/health || exit 1
          
          echo "Deployment completed successfully!"
